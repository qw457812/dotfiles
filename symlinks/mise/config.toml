# see dot_config/private_fish/conf.d/mise.fish for `MISE_DISABLE_TOOLS`, `MISE_LOCKFILE` envs
[tools]
bun = "latest"
himalaya = "latest"
java = "zulu-25"
node = "lts"
pnpm = "latest"
pre-commit = "latest"
python = "latest"
scala = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]
idiomatic_version_file_disable_files = ["node:package.json"]
experimental = true
python.uv_venv_auto = true
lockfile_platforms = ["macos-arm64", "linux-arm64"]
