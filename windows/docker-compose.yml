name: "windows"
services:
  windows:
    image: "docker.io/dockurr/windows"
    container_name: "windows"
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "8"
      DISK_SIZE: "64G"
      USERNAME: "${WIN_USER:?Set WIN_USER}"
      PASSWORD: "${WIN_PASS:?Set WIN_PASS}"
      LANGUAGE: "English"
      USER_PORTS: "22/tcp"
    cap_add:
      - "NET_ADMIN"
    privileged: true
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
      - "127.0.0.1:2222:22/tcp"
    stop_grace_period: "2m"
    restart: "no"
    volumes:
      - "./storage:/storage"
      - "${HOME}:/shared"
    devices:
      - "/dev/kvm"
      - "/dev/net/tun"
