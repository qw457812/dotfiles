# https://neovide.dev/config-file.html
# https://neovide.dev/command-line-reference.html#frame
frame = "none"

# Fixes "Failed to launch neovim runtime: Failed to parse Neovim api information. Caused by: Invalid parameter" on NVIM v0.13.0-dev-1076+g69e1321731
# neovide PR #3530 commit 7af518d
neovim-bin = "/opt/homebrew/bin/nvim"

[font]
normal = ["Maple Mono NF CN", "Symbols Nerd Font Mono"]
size = 11.5

[font.features]
# +cv01
"Maple Mono NF CN" = ["+cv35", "+cv61", "+cv62", "+ss06"]
