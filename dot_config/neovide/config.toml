# https://neovide.dev/config-file.html
# https://neovide.dev/command-line-reference.html#frame
frame = "none"

# for noice.nvim (#3517)
startup-message-capture = false

[font]
normal = ["Maple Mono NF CN", "Symbols Nerd Font Mono"]
size = 11.5

[font.features]
# +cv01
"Maple Mono NF CN" = ["+cv35", "+cv61", "+cv62", "+ss06"]
